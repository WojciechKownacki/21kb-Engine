org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true

# Release signing is intentionally not stored here. Supply either matching -P Gradle
# properties (kbSigningStoreFile, kbSigningStorePassword, kbSigningKeyAlias,
# kbSigningKeyPassword) or KB_ANDROID_SIGNING_* environment variables.
# Application identity/version may likewise be overridden with kbApplicationId,
# kbVersionCode, kbVersionName and kbApplicationLabel, or with the environment
# variables KB_ANDROID_APPLICATION_ID, KB_ANDROID_VERSION_CODE,
# KB_ANDROID_VERSION_NAME and KB_ANDROID_APPLICATION_LABEL.
