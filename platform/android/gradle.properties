org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.useAndroidX=true

# Release signing is intentionally performed only after alignment by the package
# signing broker. Gradle produces an unsigned Release APK and receives no secrets.
# Application identity/version may be overridden with kbApplicationId,
# kbVersionCode, kbVersionName and kbApplicationLabel, or with the environment
# variables KB_ANDROID_APPLICATION_ID, KB_ANDROID_VERSION_CODE,
# KB_ANDROID_VERSION_NAME and KB_ANDROID_APPLICATION_LABEL.
