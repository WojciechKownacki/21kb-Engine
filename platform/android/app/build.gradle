plugins {
    id "com.android.application"
}

import javax.inject.Inject
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.Optional
import org.gradle.api.tasks.TaskAction
import org.gradle.process.ExecOperations

abstract class ValidateRuntimeAssetPackTask extends DefaultTask {
    @Input
    @Optional
    abstract Property<String> getAssetPackPath()

    @Input
    @Optional
    abstract Property<String> getValidatorPath()

    @Input
    @Optional
    abstract Property<String> getTargetProfile()

    @Inject
    protected abstract ExecOperations getExecOperations()

    @TaskAction
    void validatePack() {
        if (!assetPackPath.isPresent()) {
            throw new GradleException(
                "A release asset pack is required. Pass " +
                "-PkbAssetPack=<absolute .kbpack path>.")
        }
        File pack = new File(assetPackPath.get())
        if (!pack.isAbsolute() || !pack.isFile() || !pack.name.endsWith(".kbpack")) {
            throw new GradleException(
                "kbAssetPack must name an existing absolute .kbpack file: ${pack}")
        }
        if (!validatorPath.isPresent()) {
            throw new GradleException(
                "The production runtime asset-pack validator is required. Pass " +
                "-PkbRuntimeAssetPackValidator=<absolute host " +
                "kb_runtime_asset_pack_validator path>.")
        }
        File validator = new File(validatorPath.get())
        if (!validator.isAbsolute() || !validator.isFile()) {
            throw new GradleException(
                "kbRuntimeAssetPackValidator must name the absolute host validator executable: " +
                "${validator}")
        }
        String validatorFileName = validator.name.toLowerCase(Locale.ROOT)
        if (validatorFileName != "kb_runtime_asset_pack_validator" &&
                validatorFileName != "kb_runtime_asset_pack_validator.exe") {
            throw new GradleException(
                "kbRuntimeAssetPackValidator must name the production " +
                "kb_runtime_asset_pack_validator executable, not a container-only validator: " +
                "${validator}")
        }
        if (!targetProfile.isPresent() ||
                !["Android.ASTC.arm64", "Android.ETC2.arm64"].contains(targetProfile.get())) {
            throw new GradleException(
                "kbTargetProfile must be Android.ASTC.arm64 or Android.ETC2.arm64")
        }

        execOperations.exec {
            commandLine validator.absolutePath, targetProfile.get(), pack.absolutePath
        }.assertNormalExitValue()
    }
}

def propertyOrEnvironment = { String propertyName, String environmentName ->
    providers.gradleProperty(propertyName).orElse(providers.environmentVariable(environmentName))
}

def repositoryRoot = rootProject.layout.projectDirectory.dir("../..")
def stagedRuntimeAssets = layout.buildDirectory.get().dir("generated/runtime-assets").asFile
def requestedAssetPackPath = providers.gradleProperty("kbAssetPack")
def requestedValidatorPath = providers.gradleProperty("kbRuntimeAssetPackValidator")
def requestedTargetProfile = providers.gradleProperty("kbTargetProfile")
def requestedApplicationId = propertyOrEnvironment(
    "kbApplicationId", "KB_ANDROID_APPLICATION_ID").orElse("com.kbengine.runtime")
def requestedVersionCode = propertyOrEnvironment(
    "kbVersionCode", "KB_ANDROID_VERSION_CODE").orElse("1")
def requestedVersionName = propertyOrEnvironment(
    "kbVersionName", "KB_ANDROID_VERSION_NAME").orElse("1.0")
def requestedApplicationLabel = propertyOrEnvironment(
    "kbApplicationLabel", "KB_ANDROID_APPLICATION_LABEL").orElse("21kb Game")
def requestedMinSdk = providers.gradleProperty("kbMinSdk").orElse("23")
def requestedTargetSdk = providers.gradleProperty("kbTargetSdk").orElse("36")
def requestedApplicationIcon = providers.gradleProperty("kbApplicationIcon")
def microphoneEnabled = providers.gradleProperty("kbMicrophone").orElse("false").get() == "true"
// The project's network use: none (offline), online (joins and hosts over the internet) or lan (also local discovery).
def networkMode = providers.gradleProperty("kbNetwork").orElse("none").get().trim()
if (!(networkMode in ["none", "online", "lan"])) {
    throw new GradleException("kbNetwork must be none, online or lan")
}
def requestedLegalAssets = providers.gradleProperty("kbLegalAssets")
// Release public key and product id the player checks its pack against; written by packaging.
def requestedTrustAnchor = providers.gradleProperty("kbTrustAnchor")
// Cooked project C++ the native host links in; empty when the project has none.
def projectNativeManifest = providers.gradleProperty("kbProjectNativeManifest").orElse("").get()
def useAssetDelivery = providers.gradleProperty("kbAssetDelivery").orElse("false").get() == "true"

def applicationIdValue = requestedApplicationId.get().trim()
def versionNameValue = requestedVersionName.get().trim()
def applicationLabelValue = requestedApplicationLabel.get().trim()
int versionCodeValue
int minSdkValue
int targetSdkValue
try {
    versionCodeValue = Integer.parseInt(requestedVersionCode.get().trim())
    minSdkValue = Integer.parseInt(requestedMinSdk.get().trim())
    targetSdkValue = Integer.parseInt(requestedTargetSdk.get().trim())
} catch (NumberFormatException ignored) {
    throw new GradleException("Android version code and SDK levels must be integers")
}
if (applicationIdValue.isEmpty()) {
    throw new GradleException("kbApplicationId / KB_ANDROID_APPLICATION_ID must not be empty")
}
if (versionCodeValue <= 0 || versionCodeValue > 2100000000) {
    throw new GradleException("kbVersionCode / KB_ANDROID_VERSION_CODE must be between 1 and 2100000000")
}
if (versionNameValue.isEmpty()) {
    throw new GradleException("kbVersionName / KB_ANDROID_VERSION_NAME must not be empty")
}
if (applicationLabelValue.isEmpty()) {
    throw new GradleException("kbApplicationLabel / KB_ANDROID_APPLICATION_LABEL must not be empty")
}
if (minSdkValue < 23 || targetSdkValue < minSdkValue || targetSdkValue > 37) {
    throw new GradleException("Android SDK levels must satisfy 23 <= minimum <= target <= 37")
}
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
if (useAssetDelivery && requestedTaskNames.any { it.contains("assemble") }) {
    throw new GradleException("Asset delivery requires a bundle task; standalone APKs must embed runtime assets")
}
if (requestedTargetProfile.isPresent()) {
    def expectedFlavor = requestedTargetProfile.get() == "Android.ASTC.arm64" ? "astc" : "etc2"
    if (requestedTaskNames.any { it.contains("assemble") || it.contains("bundle") } &&
            !requestedTaskNames.any { it.contains(expectedFlavor) }) {
        throw new GradleException(
            "The requested Gradle flavor does not match kbTargetProfile=${requestedTargetProfile.get()}")
    }
}

def generatedRuntimeResources = layout.buildDirectory.get().dir("generated/runtime-resources").asFile
// The window shows the launch screen's background colour from the first moment, so the handover to the loading
// screen the game draws does not flash another colour.
def splashBackground = providers.gradleProperty("kbSplashBackground").orElse("#0F1217").get().trim()
if (!(splashBackground ==~ /#[0-9A-Fa-f]{6}/)) {
    throw new GradleException("kbSplashBackground must be a #RRGGBB colour")
}
File splashColors = new File(generatedRuntimeResources, "values/kb_splash.xml")
splashColors.parentFile.mkdirs()
splashColors.setText("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"kb_splash_background\">${splashBackground}</color>\n</resources>\n", "UTF-8")
// The permissions are declared only for the features the project uses: the package is built from the source manifest
// plus the lines of one list (the record-audio permission, and the network permissions the mode needs).
List<String> declaredPermissions = []
if (microphoneEnabled) {
    declaredPermissions.add("android.permission.RECORD_AUDIO")
}
if (networkMode == "online" || networkMode == "lan") {
    declaredPermissions.add("android.permission.INTERNET")
    declaredPermissions.add("android.permission.ACCESS_NETWORK_STATE")
}
if (networkMode == "lan") {
    declaredPermissions.add("android.permission.CHANGE_WIFI_MULTICAST_STATE")
}
File sourceManifest = file("src/main/AndroidManifest.xml")
File packageManifest = layout.buildDirectory.get().file("generated/manifest/AndroidManifest.xml").asFile
if (!declaredPermissions.isEmpty()) {
    String manifestText = sourceManifest.getText("UTF-8")
    String applicationTag = "<application"
    if (!manifestText.contains(applicationTag)) {
        throw new GradleException("The Android manifest has no application element to declare permissions before")
    }
    StringBuilder permissionLines = new StringBuilder()
    for (String permission : declaredPermissions) {
        permissionLines.append("<uses-permission android:name=\"").append(permission).append("\" />\n\n    ")
    }
    packageManifest.parentFile.mkdirs()
    packageManifest.setText(manifestText.replace(applicationTag, permissionLines.toString() + applicationTag), "UTF-8")
}
String applicationIconResource = "@drawable/kb_launcher"
// A project icon becomes an adaptive icon on Android 8 and later: the picture sits inside the safe zone the launcher
// never crops (66 of 108 dp) on the launch screen's colour, so every launcher shape (circle, squircle, square) shows
// it whole. Older Android shows the picture itself.
File adaptiveIcon = new File(generatedRuntimeResources, "mipmap-anydpi-v26/kb_app_icon.xml")
File legacyIcon = new File(generatedRuntimeResources, "mipmap/kb_app_icon.xml")
adaptiveIcon.delete()
legacyIcon.delete()
if (requestedApplicationIcon.isPresent()) {
    File icon = new File(requestedApplicationIcon.get())
    if (!icon.isAbsolute() || !icon.isFile() || !icon.name.toLowerCase(Locale.ROOT).endsWith(".png")) {
        throw new GradleException("kbApplicationIcon must name an existing absolute PNG file")
    }
    adaptiveIcon.parentFile.mkdirs()
    adaptiveIcon.setText("""<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/kb_splash_background" />
    <foreground>
        <inset android:drawable="@drawable/kb_custom_launcher" android:inset="19.5%" />
    </foreground>
</adaptive-icon>
""", "UTF-8")
    legacyIcon.parentFile.mkdirs()
    legacyIcon.setText("""<?xml version="1.0" encoding="utf-8"?>
<bitmap xmlns:android="http://schemas.android.com/apk/res/android" android:src="@drawable/kb_custom_launcher" />
""", "UTF-8")
    applicationIconResource = "@mipmap/kb_app_icon"
}

android {
    if (useAssetDelivery) assetPacks = [":runtimeassets"]
    namespace = "com.kbengine.runtime"
    compileSdk = Math.max(36, targetSdkValue)
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId = applicationIdValue
        minSdk = minSdkValue
        targetSdk = targetSdkValue
        versionCode = versionCodeValue
        versionName = versionNameValue
        manifestPlaceholders["kbApplicationLabel"] = applicationLabelValue
        manifestPlaceholders["kbApplicationIcon"] = applicationIconResource

        ndk {
            abiFilters += ["arm64-v8a"]
        }

        externalNativeBuild {
            cmake {
                def nativeJobs = providers.environmentVariable("CMAKE_BUILD_PARALLEL_LEVEL").getOrNull()
                if (nativeJobs != null && !nativeJobs.isEmpty()) {
                    if (!(nativeJobs ==~ /[1-9][0-9]*/)) {
                        throw new GradleException("CMAKE_BUILD_PARALLEL_LEVEL must be a positive integer")
                    }
                    arguments += [
                        "-DCMAKE_JOB_POOLS=kb_limit=${nativeJobs}",
                        "-DCMAKE_JOB_POOL_COMPILE=kb_limit",
                        "-DCMAKE_JOB_POOL_LINK=kb_limit"
                    ]
                }
                targets += ["kb_game_android"]
                arguments += [
                    "-DANDROID_STL=c++_shared",
                    "-DKB_BUILD_ANDROID_HOST=ON",
                    "-DKB_BUILD_PACKAGED_GAME_HOST=ON",
                    "-DKB_BUILD_RENDERER=ON",
                    "-DBUILD_TESTING=OFF",
                    "-DKB_BUILD_EDITOR=OFF",
                    "-DKB_BUILD_PROVIDER_MODULES_AS_DLL=OFF",
                    "-DKB_BUILD_GRAPH_SHADERC=OFF",
                    "-DKB_GENERATE_RENDERER_SHADERS=OFF",
                    "-DKB_PROJECT_NATIVE_MANIFEST=${projectNativeManifest}"
                ]
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile(declaredPermissions.isEmpty() ? sourceManifest : packageManifest)
        }
    }

    flavorDimensions += ["texture"]
    productFlavors {
        astc {
            dimension = "texture"
            externalNativeBuild.cmake.arguments += ["-DKB_ANDROID_TEXTURE_PROFILE=ASTC"]
        }
        etc2 {
            dimension = "texture"
            externalNativeBuild.cmake.arguments += ["-DKB_ANDROID_TEXTURE_PROFILE=ETC2"]
        }
    }

    buildTypes {
        debug {
            // A development package stays debuggable but runs optimized native code, so its frame times mean something.
            debuggable = true
            externalNativeBuild.cmake.arguments += ["-DCMAKE_BUILD_TYPE=RelWithDebInfo", "-DKB_DEVELOPMENT_PLAYER=ON"]
        }
        release {
            debuggable = false
            minifyEnabled = false
            // The native libraries ship stripped; their full symbols go into the bundle's metadata, where the
            // store reads them to symbolicate crash reports, and into native-debug-symbols.zip for an APK.
            ndk {
                debugSymbolLevel = "FULL"
            }
        }
    }

    buildFeatures {
        prefab = true
    }

    externalNativeBuild {
        cmake {
            path = repositoryRoot.file("CMakeLists.txt")
            version = "4.1.2"
        }
    }

    androidResources {
        noCompress += ["kbpack"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main.assets.srcDir(stagedRuntimeAssets)
        main.res.srcDir(generatedRuntimeResources)
    }
}

configurations {
    // The bundle tool the packager validates app bundles with and installs them for testing, resolved from the
    // same repositories as the Android build, so no separate download is needed.
    kbBundletool
}

dependencies {
    kbBundletool "com.android.tools.build:bundletool:1.18.3"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.games:games-activity:4.4.2"
    implementation "androidx.games:games-controller:2.0.2"
}

def validateRuntimeAssetPack = tasks.register(
        "validateRuntimeAssetPack", ValidateRuntimeAssetPackTask) {
    assetPackPath.set(requestedAssetPackPath)
    validatorPath.set(requestedValidatorPath)
    targetProfile.set(requestedTargetProfile)
}

tasks.register("stageRuntimeAssets", Sync) {
    dependsOn(validateRuntimeAssetPack)
    into(stagedRuntimeAssets)

    doFirst {
        if (!requestedLegalAssets.isPresent()) {
            throw new GradleException(
                "kbLegalAssets must name the staged third-party notices directory")
        }
        File legalAssetsDirectory = new File(requestedLegalAssets.get())
        if (!legalAssetsDirectory.isAbsolute() || !legalAssetsDirectory.isDirectory()) {
            throw new GradleException("kbLegalAssets must name an existing absolute directory")
        }
    }

    if (requestedAssetPackPath.isPresent() && !useAssetDelivery) {
        from(new File(requestedAssetPackPath.get())) {
            rename { "game.kbpack" }
        }
    }
    if (requestedLegalAssets.isPresent()) {
        from(new File(requestedLegalAssets.get()))
    }
    if (requestedTrustAnchor.isPresent()) {
        from(new File(requestedTrustAnchor.get())) {
            rename { "kb_trust_anchor.bin" }
        }
    }
}

tasks.register("stageApplicationIcon", Sync) {
    into(new File(generatedRuntimeResources, "drawable-nodpi"))
    if (requestedApplicationIcon.isPresent()) {
        from(new File(requestedApplicationIcon.get())) {
            rename { "kb_custom_launcher.png" }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("stageRuntimeAssets")
    dependsOn("stageApplicationIcon")
}

// Copies the bundle tool and its libraries to build/bundletool, run as
// java -cp "build/bundletool/*" com.android.tools.build.bundletool.BundleToolMain.
tasks.register("kbStageBundletool", Sync) {
    from(configurations.kbBundletool)
    into(layout.buildDirectory.dir("bundletool"))
}
