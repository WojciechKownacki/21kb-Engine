plugins {
    id "com.android.application"
}

import javax.inject.Inject
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.Optional
import org.gradle.api.tasks.TaskAction
import org.gradle.process.ExecOperations

abstract class ValidateRuntimeAssetPackTask extends DefaultTask {
    @Input
    @Optional
    abstract Property<String> getAssetPackPath()

    @Input
    @Optional
    abstract Property<String> getValidatorPath()

    @Input
    @Optional
    abstract Property<String> getTargetProfile()

    @Inject
    protected abstract ExecOperations getExecOperations()

    @TaskAction
    void validatePack() {
        if (!assetPackPath.isPresent()) {
            throw new GradleException(
                "A release asset pack is required. Pass " +
                "-PkbAssetPack=<absolute .kbpack path>.")
        }
        File pack = new File(assetPackPath.get())
        if (!pack.isAbsolute() || !pack.isFile() || !pack.name.endsWith(".kbpack")) {
            throw new GradleException(
                "kbAssetPack must name an existing absolute .kbpack file: ${pack}")
        }
        if (!validatorPath.isPresent()) {
            throw new GradleException(
                "The production runtime asset-pack validator is required. Pass " +
                "-PkbRuntimeAssetPackValidator=<absolute host " +
                "kb_runtime_asset_pack_validator path>.")
        }
        File validator = new File(validatorPath.get())
        if (!validator.isAbsolute() || !validator.isFile()) {
            throw new GradleException(
                "kbRuntimeAssetPackValidator must name the absolute host validator executable: " +
                "${validator}")
        }
        String validatorFileName = validator.name.toLowerCase(Locale.ROOT)
        if (validatorFileName != "kb_runtime_asset_pack_validator" &&
                validatorFileName != "kb_runtime_asset_pack_validator.exe") {
            throw new GradleException(
                "kbRuntimeAssetPackValidator must name the production " +
                "kb_runtime_asset_pack_validator executable, not a container-only validator: " +
                "${validator}")
        }
        if (!targetProfile.isPresent() ||
                !["Android.ASTC.arm64", "Android.ETC2.arm64"].contains(targetProfile.get())) {
            throw new GradleException(
                "kbTargetProfile must be Android.ASTC.arm64 or Android.ETC2.arm64")
        }

        execOperations.exec {
            commandLine validator.absolutePath, targetProfile.get(), pack.absolutePath
        }.assertNormalExitValue()
    }
}

def propertyOrEnvironment = { String propertyName, String environmentName ->
    providers.gradleProperty(propertyName).orElse(providers.environmentVariable(environmentName))
}

def repositoryRoot = rootProject.layout.projectDirectory.dir("../..")
def stagedRuntimeAssets = layout.buildDirectory.get().dir("generated/runtime-assets").asFile
def requestedAssetPackPath = providers.gradleProperty("kbAssetPack")
def requestedValidatorPath = providers.gradleProperty("kbRuntimeAssetPackValidator")
def requestedTargetProfile = providers.gradleProperty("kbTargetProfile")
def requestedApplicationId = propertyOrEnvironment(
    "kbApplicationId", "KB_ANDROID_APPLICATION_ID").orElse("com.kbengine.runtime")
def requestedVersionCode = propertyOrEnvironment(
    "kbVersionCode", "KB_ANDROID_VERSION_CODE").orElse("1")
def requestedVersionName = propertyOrEnvironment(
    "kbVersionName", "KB_ANDROID_VERSION_NAME").orElse("1.0")
def requestedApplicationLabel = propertyOrEnvironment(
    "kbApplicationLabel", "KB_ANDROID_APPLICATION_LABEL").orElse("21kb Game")
def requestedMinSdk = providers.gradleProperty("kbMinSdk").orElse("28")
def requestedTargetSdk = providers.gradleProperty("kbTargetSdk").orElse("35")
def requestedApplicationIcon = providers.gradleProperty("kbApplicationIcon")
def requestedLegalAssets = providers.gradleProperty("kbLegalAssets")

def applicationIdValue = requestedApplicationId.get().trim()
def versionNameValue = requestedVersionName.get().trim()
def applicationLabelValue = requestedApplicationLabel.get().trim()
int versionCodeValue
int minSdkValue
int targetSdkValue
try {
    versionCodeValue = Integer.parseInt(requestedVersionCode.get().trim())
    minSdkValue = Integer.parseInt(requestedMinSdk.get().trim())
    targetSdkValue = Integer.parseInt(requestedTargetSdk.get().trim())
} catch (NumberFormatException ignored) {
    throw new GradleException("Android version code and SDK levels must be integers")
}
if (applicationIdValue.isEmpty()) {
    throw new GradleException("kbApplicationId / KB_ANDROID_APPLICATION_ID must not be empty")
}
if (versionCodeValue <= 0 || versionCodeValue > 2100000000) {
    throw new GradleException("kbVersionCode / KB_ANDROID_VERSION_CODE must be between 1 and 2100000000")
}
if (versionNameValue.isEmpty()) {
    throw new GradleException("kbVersionName / KB_ANDROID_VERSION_NAME must not be empty")
}
if (applicationLabelValue.isEmpty()) {
    throw new GradleException("kbApplicationLabel / KB_ANDROID_APPLICATION_LABEL must not be empty")
}
if (minSdkValue < 28 || targetSdkValue < minSdkValue || targetSdkValue > 36) {
    throw new GradleException("Android SDK levels must satisfy 28 <= minimum <= target <= 36")
}
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
if (requestedTargetProfile.isPresent()) {
    def expectedFlavor = requestedTargetProfile.get() == "Android.ASTC.arm64" ? "astc" : "etc2"
    if (requestedTaskNames.any { it.contains("assemble") } &&
            !requestedTaskNames.any { it.contains(expectedFlavor) }) {
        throw new GradleException(
            "The requested Gradle flavor does not match kbTargetProfile=${requestedTargetProfile.get()}")
    }
}

def generatedRuntimeResources = layout.buildDirectory.get().dir("generated/runtime-resources").asFile
String applicationIconResource = "@drawable/kb_launcher"
if (requestedApplicationIcon.isPresent()) {
    File icon = new File(requestedApplicationIcon.get())
    if (!icon.isAbsolute() || !icon.isFile() || !icon.name.toLowerCase(Locale.ROOT).endsWith(".png")) {
        throw new GradleException("kbApplicationIcon must name an existing absolute PNG file")
    }
    applicationIconResource = "@drawable/kb_custom_launcher"
}

android {
    namespace = "com.kbengine.runtime"
    compileSdk = 36
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId = applicationIdValue
        minSdk = minSdkValue
        targetSdk = targetSdkValue
        versionCode = versionCodeValue
        versionName = versionNameValue
        manifestPlaceholders["kbApplicationLabel"] = applicationLabelValue
        manifestPlaceholders["kbApplicationIcon"] = applicationIconResource

        ndk {
            abiFilters += ["arm64-v8a"]
        }

        externalNativeBuild {
            cmake {
                targets += ["kb_game_android"]
                arguments += [
                    "-DKB_BUILD_ANDROID_HOST=ON",
                    "-DKB_BUILD_PACKAGED_GAME_HOST=ON",
                    "-DKB_BUILD_RENDERER=ON",
                    "-DBUILD_TESTING=OFF",
                    "-DKB_BUILD_EDITOR=OFF",
                    "-DKB_BUILD_PROVIDER_MODULES_AS_DLL=OFF",
                    "-DKB_BUILD_GRAPH_SHADERC=OFF",
                    "-DKB_GENERATE_RENDERER_SHADERS=OFF"
                ]
            }
        }
    }

    flavorDimensions += ["texture"]
    productFlavors {
        astc {
            dimension = "texture"
            externalNativeBuild.cmake.arguments += ["-DKB_ANDROID_TEXTURE_PROFILE=ASTC"]
        }
        etc2 {
            dimension = "texture"
            externalNativeBuild.cmake.arguments += ["-DKB_ANDROID_TEXTURE_PROFILE=ETC2"]
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            debuggable = false
            minifyEnabled = false
        }
    }

    buildFeatures {
        prefab = true
    }

    externalNativeBuild {
        cmake {
            path = repositoryRoot.file("CMakeLists.txt")
            version = "4.3.1"
        }
    }

    androidResources {
        noCompress += ["kbpack"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main.assets.srcDir(stagedRuntimeAssets)
        main.res.srcDir(generatedRuntimeResources)
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.games:games-activity:4.4.2"
}

def validateRuntimeAssetPack = tasks.register(
        "validateRuntimeAssetPack", ValidateRuntimeAssetPackTask) {
    assetPackPath.set(requestedAssetPackPath)
    validatorPath.set(requestedValidatorPath)
    targetProfile.set(requestedTargetProfile)
}

tasks.register("stageRuntimeAssets", Sync) {
    dependsOn(validateRuntimeAssetPack)
    into(stagedRuntimeAssets)

    doFirst {
        if (!requestedLegalAssets.isPresent()) {
            throw new GradleException(
                "kbLegalAssets must name the staged third-party notices directory")
        }
        File legalAssetsDirectory = new File(requestedLegalAssets.get())
        if (!legalAssetsDirectory.isAbsolute() || !legalAssetsDirectory.isDirectory()) {
            throw new GradleException("kbLegalAssets must name an existing absolute directory")
        }
    }

    if (requestedAssetPackPath.isPresent()) {
        from(new File(requestedAssetPackPath.get())) {
            rename { "game.kbpack" }
        }
    }
    if (requestedLegalAssets.isPresent()) {
        from(new File(requestedLegalAssets.get()))
    }
}

tasks.register("stageApplicationIcon", Sync) {
    into(new File(generatedRuntimeResources, "drawable-nodpi"))
    if (requestedApplicationIcon.isPresent()) {
        from(new File(requestedApplicationIcon.get())) {
            rename { "kb_custom_launcher.png" }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("stageRuntimeAssets")
    dependsOn("stageApplicationIcon")
}
