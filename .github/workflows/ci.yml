name: CI

on:
  push:
    branches: [Release, main, master, "1.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "OFF"
            targets: "kb_engine_tests;kb_audio_runtime_tests;kb_engine_library_tests;kb_library_benchmarks;kb_library_safety_tests;kb_ecs_api_tests;kb_ecs_scheduler_correctness_tests;kb_ecs_deterministic_replay_tests;kb_ecs_stress_tests;kb_ecs_snapshot_scale_tests;kb_renderer_tests;kb_skeletal_animator_benchmarks;kb_terrain_editor_tests;kb_editor_tests;kb_editor_material_graph_canvas_tests;kb_standalone_player;kb_editor;kb_cli;kb_cli_tests"
            api_compat_check: "ON"
            test_regex: ""
          - name: Windows MSVC ASan
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "ON"
            targets: "kb_21kb_particle_snapshot_tests;kb_21kb_particle_cpu_backend_tests;kb_21kb_particle_editor_tests;kb_21kb_particle_renderer_tests;kb_renderer_tests"
            api_compat_check: "OFF"
            test_regex: "^(kb_21kb_particle_snapshot_tests|kb_21kb_particle_cpu_backend_tests|kb_21kb_particle_editor_tests|kb_21kb_particle_renderer_tests|kb_renderer_tests)$"
          - name: Linux GCC ASan UBSan
            os: ubuntu-24.04
            generator: "Unix Makefiles"
            build_editor: "OFF"
            build_renderer: "OFF"
            sanitizer: "ON"
            targets: "kb_engine_tests;kb_audio_runtime_tests;kb_engine_library_tests;kb_library_benchmarks;kb_library_safety_tests;kb_ecs_api_tests;kb_ecs_scheduler_correctness_tests;kb_ecs_deterministic_replay_tests;kb_ecs_stress_tests;kb_ecs_snapshot_scale_tests;kb_cli_tests"
            api_compat_check: "OFF"
            test_regex: ""
          - name: macOS Clang ASan UBSan
            os: macos-15
            generator: "Unix Makefiles"
            build_editor: "OFF"
            build_renderer: "OFF"
            sanitizer: "ON"
            targets: "kb_engine_tests;kb_audio_runtime_tests;kb_engine_library_tests;kb_library_benchmarks;kb_library_safety_tests;kb_ecs_api_tests;kb_ecs_scheduler_correctness_tests;kb_ecs_deterministic_replay_tests;kb_ecs_stress_tests;kb_ecs_snapshot_scale_tests;kb_cli_tests"
            api_compat_check: "OFF"
            test_regex: ""

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: "false"
        with:
            submodules: recursive
            fetch-depth: 0

      - name: Validate changed patch whitespace
        shell: pwsh
        run: |
          $base = "${{ github.event.before }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
          }
          if ($base -and $base -ne "0000000000000000000000000000000000000000" -and (git cat-file -e "$base^{commit}" 2>$null)) {
            git diff --check $base HEAD
          } else {
            git diff --check HEAD^ HEAD
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure
        shell: pwsh
        run: |
          $configureArgs = @(
            "-S", ".",
            "-B", "build/ci",
            "-G", "${{ matrix.generator }}",
            "-DKB_BUILD_EDITOR=${{ matrix.build_editor }}",
            "-DKB_BUILD_RENDERER=${{ matrix.build_renderer }}",
            "-DKB_ENABLE_SANITIZERS=${{ matrix.sanitizer }}",
            "-DKB_STRICT_OWN_WARNINGS=ON"
          )
          if (-not "${{ matrix.generator }}".StartsWith("Visual Studio")) {
            $configureArgs += "-DCMAKE_BUILD_TYPE=Debug"
          }
          cmake @configureArgs

      - name: Clean build with strict first-party warnings
        shell: pwsh
        run: |
          "${{ matrix.targets }}".Split(';') | ForEach-Object {
            cmake --build build/ci --config Debug --parallel 4 --target $_
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Test
        shell: pwsh
        run: |
          $testArgs = @("--test-dir", "build/ci", "-C", "Debug", "--output-on-failure")
          # Sanitizers deliberately distort timings; correctness and safety tests still run,
          # while the performance budget remains enforced by the unsanitized Windows job.
          if ("${{ matrix.sanitizer }}" -eq "ON") {
            $testArgs += @("--label-exclude", "performance")
          }
          if ("${{ matrix.test_regex }}") {
            $testArgs += @("-R", "${{ matrix.test_regex }}")
          }
          ctest @testArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # LIB-024: fail the build on a breaking change to the script API
      # surface versus the committed baseline. Runs only on the full
      # Windows build that generated the baseline; the reconstructed catalog
      # is platform-independent (renderer script APIs are compiled into
      # kb_engine unconditionally), but restricting to one job keeps the
      # gate unambiguous. An intentional API change updates the baseline via
      # `kb_cli api-check --baseline others/api_baseline/script_api.json
      # --update-baseline` in the same PR.
      - name: API compatibility check
        if: matrix.api_compat_check == 'ON'
        shell: pwsh
        run: |
          & "build/ci/bin/Debug/kb_cli.exe" api-check --baseline others/api_baseline/script_api.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
