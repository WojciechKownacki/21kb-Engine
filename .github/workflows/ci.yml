name: CI

on:
  push:
    branches: [Release, main, master, "1.0"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the clang-tidy gate over every first-party source.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  native-read-batches:
    name: Linux native read batches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build isolated native read tests with sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-missing-field-initializers \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g -pthread \
            -Isources/engine/include sources/engine/src/assets/streaming/BackgroundLoadService.cpp \
            sources/engine/tests/BackgroundReadBatchTests.cpp -lrt -o background-read-tests
      - name: Verify native batches, priority, cancellation and exact ranges
        run: ./background-read-tests

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            configuration: "Release"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "OFF"
            targets: ""
            api_compat_check: "ON"
            test_regex: ""
          - name: Windows MSVC ASan
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            configuration: "Debug"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "ON"
            targets: "kb_21kb_particle_snapshot_tests;kb_21kb_particle_cpu_backend_tests;kb_21kb_particle_editor_tests;kb_21kb_particle_renderer_tests;kb_renderer_tests;kb_ecs_query_shutdown_tests;kb_background_read_tests;kb_test_process_error_tests"
            api_compat_check: "OFF"
            test_regex: "^(kb_21kb_particle_snapshot_tests|kb_21kb_particle_cpu_backend_tests|kb_21kb_particle_editor_tests|kb_21kb_particle_renderer_tests|kb_renderer_tests|kb_ecs_query_shutdown_tests|kb_background_read_tests|kb_test_process_errors)$"
          - name: Linux GCC ASan UBSan
            os: ubuntu-24.04
            generator: "Unix Makefiles"
            configuration: "Debug"
            build_editor: "OFF"
            build_renderer: "OFF"
            sanitizer: "ON"
            targets: ""
            api_compat_check: "OFF"
            test_regex: ""
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: "false"
        with:
            submodules: recursive
            fetch-depth: 0

      - name: Validate changed patch whitespace
        shell: pwsh
        run: |
          $base = "${{ github.event.before }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
          }
          if ($base -and $base -ne "0000000000000000000000000000000000000000" -and (git rev-parse --verify --quiet "$base^{commit}" 2>$null)) {
            git diff --check $base HEAD
          } else {
            git diff --check HEAD^ HEAD
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure
        shell: pwsh
        run: |
          $configureArgs = @(
            "-S", ".",
            "-B", "build/ci",
            "-G", "${{ matrix.generator }}",
            "-DKB_BUILD_EDITOR=${{ matrix.build_editor }}",
            "-DKB_BUILD_RENDERER=${{ matrix.build_renderer }}",
            "-DBUILD_TESTING=ON",
            "-DKB_ENABLE_SANITIZERS=${{ matrix.sanitizer }}",
            "-DKB_STRICT_OWN_WARNINGS=ON"
          )
          if (-not "${{ matrix.generator }}".StartsWith("Visual Studio")) {
            $configureArgs += "-DCMAKE_BUILD_TYPE=${{ matrix.configuration }}"
          }
          cmake @configureArgs

      - name: Clean build with strict first-party warnings
        shell: pwsh
        run: |
          # Full jobs build the default graph, including every registered test executable.
          # The focused sanitizer job builds only the targets selected by its test regex.
          $buildArgs = @("--build", "build/ci", "--config", "${{ matrix.configuration }}", "--parallel", "4")
          if ("${{ matrix.targets }}") {
            $buildArgs += "--target"
            $buildArgs += "${{ matrix.targets }}".Split(';')
          }
          cmake @buildArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test
        shell: pwsh
        run: |
          $testArgs = @("--test-dir", "build/ci", "-C", "${{ matrix.configuration }}", "--output-on-failure",
            "--no-tests=error", "--output-junit", "TestResults.xml")
          # Sanitizers deliberately distort timings; correctness and safety tests still run,
          # while the performance budget remains enforced by the unsanitized Windows job.
          if ("${{ matrix.sanitizer }}" -eq "ON") {
            $testArgs += @("--label-exclude", "performance")
          }
          if ("${{ matrix.test_regex }}") {
            $testArgs += @("-R", "${{ matrix.test_regex }}")
          }
          ctest @testArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            build/ci/TestResults.xml
            build/ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # LIB-024: fail the build on a breaking change to the script API
      # surface versus the committed baseline. Runs only on the full
      # Windows build that generated the baseline; the reconstructed catalog
      # is platform-independent (renderer script APIs are compiled into
      # kb_engine unconditionally), but restricting to one job keeps the
      # gate unambiguous. An intentional API change updates the baseline via
      # `kb_cli api-check --baseline tests/api_baseline/script_api.json
      # --update-baseline` in the same PR.
      - name: API compatibility check
        if: matrix.api_compat_check == 'ON'
        shell: pwsh
        run: |
          & "build/ci/bin/${{ matrix.configuration }}/kb_cli.exe" api-check --baseline tests/api_baseline/script_api.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Script tests: the package contract, platform staging, third-party notices, SBOM and the
      # editor's translations (every editor text in all 32 catalogs).
      - name: Script tests
        if: matrix.name == 'Windows MSVC'
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  clang-tidy:
    name: clang-tidy gate
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
            submodules: recursive
            fetch-depth: 0

      # Ninja with the MSVC environment gives the compile database the gate reads.
      - name: Configure with a compile database
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Release -DKB_BUILD_EDITOR=ON -DKB_BUILD_GRAPH_SHADERC=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Pushes and pull requests check what they change; the weekly run checks every source.
      - name: clang-tidy
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $base = "${{ github.event.before }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
          }
          $scope = ""
          if ("${{ github.event_name }}" -ne "schedule" -and "${{ github.event_name }}" -ne "workflow_dispatch" -and
              $base -and $base -ne "0000000000000000000000000000000000000000" -and (git rev-parse --verify --quiet "$base^{commit}" 2>$null)) {
            $scope = "--changed-since $base"
          }
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && python scripts/clang_tidy_gate.py --build-dir build/tidy --jobs 4 $scope"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  # libFuzzer harnesses for the readers of untrusted files (fuzz/). Replays every
  # committed seed and regression input, then gives each harness a minute of fresh
  # inputs; any crash, leak, hang or AddressSanitizer report fails the job.
  fuzz:
    name: Fuzz untrusted-input readers
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: "false"
        with:
            submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/fuzz -G "Visual Studio 18 2026" `
            -DKB_BUILD_FUZZERS=ON -DKB_ENABLE_SANITIZERS=ON -DKB_BUILD_EDITOR=OFF `
            -DKB_BUILD_GRAPH_SHADERC=OFF -DKB_STRICT_OWN_WARNINGS=ON
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build fuzzers
        shell: pwsh
        run: |
          cmake --build build/fuzz --config Release --parallel 4 --target kb_fuzzers
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Replay corpora
        shell: pwsh
        run: |
          ctest --test-dir build/fuzz -C Release -L fuzz --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Fuzz each reader for 60 seconds
        shell: pwsh
        run: |
          $failed = @()
          New-Item -ItemType Directory -Force build/fuzz/artifacts | Out-Null
          foreach ($corpus in Get-ChildItem fuzz/corpus -Directory) {
            $name = $corpus.Name
            $work = "build/fuzz/work/$name"
            New-Item -ItemType Directory -Force $work | Out-Null
            & "build/fuzz/fuzz/Release/kb_fuzz_$name.exe" $work $corpus.FullName `
              -max_total_time=60 -timeout=10 -rss_limit_mb=3072 -malloc_limit_mb=2048 `
              "-artifact_prefix=build/fuzz/artifacts/$name-"
            if ($LASTEXITCODE -ne 0) {
              $failed += $name
            }
          }
          if ($failed.Count -ne 0) {
            Write-Error "Fuzzing found failures in: $($failed -join ', ')"
            exit 1
          }

      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts
          if-no-files-found: ignore
