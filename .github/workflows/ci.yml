name: CI

on:
  push:
    branches: [Release, main, master, "1.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "OFF"
            targets: "kb_engine_tests;kb_renderer_tests;kb_editor_tests;kb_editor"
          - name: Linux GCC ASan UBSan
            os: ubuntu-24.04
            generator: "Unix Makefiles"
            build_editor: "OFF"
            build_renderer: "OFF"
            sanitizer: "ON"
            targets: "kb_engine_tests"
          - name: macOS Clang ASan UBSan
            os: macos-15
            generator: "Unix Makefiles"
            build_editor: "OFF"
            build_renderer: "OFF"
            sanitizer: "ON"
            targets: "kb_engine_tests"

    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: "false"
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          $configureArgs = @(
            "-S", ".",
            "-B", "build/ci",
            "-G", "${{ matrix.generator }}",
            "-DKB_BUILD_EDITOR=${{ matrix.build_editor }}",
            "-DKB_BUILD_RENDERER=${{ matrix.build_renderer }}",
            "-DKB_ENABLE_SANITIZERS=${{ matrix.sanitizer }}"
          )
          if (-not "${{ matrix.generator }}".StartsWith("Visual Studio")) {
            $configureArgs += "-DCMAKE_BUILD_TYPE=Debug"
          }
          cmake @configureArgs

      - name: Build
        shell: pwsh
        run: |
          "${{ matrix.targets }}".Split(';') | ForEach-Object {
            cmake --build build/ci --config Debug --target $_
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/ci -C Debug --output-on-failure
