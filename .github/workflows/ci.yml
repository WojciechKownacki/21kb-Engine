name: CI

on:
  push:
    branches: [Release, main, master, "1.0"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: the clang-tidy gate over every first-party source.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  web-player:
    name: Web player bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache-web
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v6
      - name: Set up the browser toolchain
        uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Install the compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ccache
      - name: Restore Web compiler objects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/ccache-web
          key: ${{ runner.os }}-emsdk-6.0.9-webgl-ccache-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-emsdk-6.0.9-webgl-ccache-v1-
      - name: Build the production WebGL player
        env:
          EM_COMPILER_WRAPPER: ccache
        run: |
          ccache --max-size=1G
          cmake -S . -B build/web-player -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DKB_BUILD_EDITOR=OFF -DKB_BUILD_RENDERER=ON \
            -DKB_BUILD_GRAPH_SHADERC=OFF -DKB_GENERATE_RENDERER_SHADERS=OFF \
            -DKB_BUILD_PACKAGED_GAME_HOST=ON -DKB_WEB_RENDERER=WEBGL
          cmake --build build/web-player --target kb_game_webgl --parallel 2
          ccache --show-stats
      - name: Verify bootstrap failures before native startup
        run: |
          python3 -m venv build/web-player-tools
          build/web-player-tools/bin/python -m pip install --require-hashes -r sources/game/tests/web/requirements.txt
          browser="$(command -v google-chrome || command -v chromium)"
          build/web-player-tools/bin/python sources/game/tests/web/run_wasm_bootstrap_failure_tests.py \
            --browser "$browser" --directory build/web-player/bin --output build/web-player-results
      - name: Keep bootstrap results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-player-bootstrap
          path: |
            build/web-player-results/**/result.json
            build/web-player-results/**/*events.json
            build/web-player-results/**/*browser.log
            build/web-player-results/**/*states.json
          if-no-files-found: ignore

  web-input:
    name: Web input ASan UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up the browser toolchain
        uses: emscripten-core/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache
      - name: Build the production touch collector with sanitizers
        run: |
          cmake -S sources/game/tests/web -B build/web-input -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/web-input --parallel 2
      - name: Verify cooperative browser work lifetimes
        run: node build/web-input/BackgroundLoadTests.js
      - name: Verify trusted browser touches and native readback
        run: |
          python3 -m venv build/web-input-tools
          build/web-input-tools/bin/python -m pip install --require-hashes -r sources/game/tests/web/requirements.txt
          browser="$(command -v google-chrome || command -v chromium)"
          build/web-input-tools/bin/python sources/game/tests/web/run_input_tests.py \
            --browser "$browser" --directory build/web-input --output build/web-input-results
      - name: Keep browser input results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-input-results
          path: |
            build/web-input-results/result.json
            build/web-input-results/browser-events.json
            build/web-input-results/browser.log
          if-no-files-found: ignore

  native-read-batches:
    name: Linux native read batches
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build isolated native read tests with sanitizers
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Wno-missing-field-initializers \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g -pthread \
            -Isources/engine/include sources/engine/src/assets/streaming/BackgroundLoadService.cpp \
            sources/engine/tests/BackgroundReadBatchTests.cpp -lrt -o background-read-tests
      - name: Verify native batches, priority, cancellation and exact ranges
        run: ./background-read-tests

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            configuration: "Release"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "OFF"
            targets: ""
            api_compat_check: "ON"
            test_regex: ""
          - name: Windows MSVC ASan
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            configuration: "Debug"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "ON"
            targets: "kb_engine_tests;kb_21kb_particle_snapshot_tests;kb_21kb_particle_cpu_backend_tests;kb_21kb_particle_editor_tests;kb_21kb_particle_renderer_tests;kb_renderer_tests;kb_ecs_query_shutdown_tests;kb_background_read_tests;kb_test_process_error_tests"
            api_compat_check: "OFF"
            test_regex: "^(kb_engine_scene_ui|kb_engine_scene_transform_golden|kb_engine_scene_parenting|kb_engine_hierarchy_depth|kb_engine_scene_hierarchy_depth|kb_engine_prefab_hierarchy_depth|kb_engine_ecs_batch_hierarchy_depth|kb_21kb_particle_snapshot_tests|kb_21kb_particle_cpu_backend_tests|kb_21kb_particle_editor_tests|kb_21kb_particle_renderer_tests|kb_renderer_tests|kb_ecs_query_shutdown_tests|kb_background_read_tests|kb_test_process_errors|kb_renderer_assertion_errors|kb_renderer_display_alpha|kb_renderer_graph_program_lifetime|kb_renderer_graph_shader_node_cook_[0-3])$"
          - name: Linux GCC ASan UBSan
            os: ubuntu-24.04
            generator: "Unix Makefiles"
            configuration: "Debug"
            build_editor: "OFF"
            build_renderer: "OFF"
            sanitizer: "ON"
            targets: ""
            api_compat_check: "OFF"
            test_regex: ""
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: "false"
        with:
            submodules: recursive
            fetch-depth: 0

      - name: Validate changed patch whitespace
        shell: pwsh
        run: |
          $base = "${{ github.event.before }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
          }
          if ($base -and $base -ne "0000000000000000000000000000000000000000" -and (git rev-parse --verify --quiet "$base^{commit}" 2>$null)) {
            git diff --check $base HEAD
          } else {
            git diff --check HEAD^ HEAD
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure
        shell: pwsh
        run: |
          $configureArgs = @(
            "-S", ".",
            "-B", "build/ci",
            "-G", "${{ matrix.generator }}",
            "-DKB_BUILD_EDITOR=${{ matrix.build_editor }}",
            "-DKB_BUILD_RENDERER=${{ matrix.build_renderer }}",
            "-DBUILD_TESTING=ON",
            "-DKB_ENABLE_SANITIZERS=${{ matrix.sanitizer }}",
            "-DKB_STRICT_OWN_WARNINGS=ON"
          )
          if (-not "${{ matrix.generator }}".StartsWith("Visual Studio")) {
            $configureArgs += "-DCMAKE_BUILD_TYPE=${{ matrix.configuration }}"
          }
          cmake @configureArgs

      - name: Clean build with strict first-party warnings
        shell: pwsh
        run: |
          # Full jobs build the default graph, including every registered test executable.
          # The focused sanitizer job builds only the targets selected by its test regex.
          $buildArgs = @("--build", "build/ci", "--config", "${{ matrix.configuration }}", "--parallel", "4")
          if ("${{ matrix.targets }}") {
            $buildArgs += "--target"
            $buildArgs += "${{ matrix.targets }}".Split(';')
          }
          cmake @buildArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test
        id: tests
        shell: pwsh
        run: |
          $testArgs = @("--test-dir", "build/ci", "-C", "${{ matrix.configuration }}", "--output-on-failure",
            "--no-tests=error", "--output-junit", "TestResults.xml")
          # Sanitizers deliberately distort timings; correctness and safety tests still run,
          # while the performance budget remains enforced by the unsanitized Windows job.
          if ("${{ matrix.sanitizer }}" -eq "ON") {
            $testArgs += @("--label-exclude", "performance")
          }
          if ("${{ matrix.test_regex }}") {
            $testArgs += @("-R", "${{ matrix.test_regex }}")
          }
          ctest @testArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Profile Linux UI after a test failure
        if: failure() && runner.os == 'Linux' && steps.tests.outcome == 'failure'
        timeout-minutes: 5
        shell: bash
        run: |
          if ! grep -q ':kb_engine_scene_ui$' build/ci/Testing/Temporary/LastTestsFailed.log; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends linux-tools-generic
          # Kernel tool packages expose perf through versioned symlinks.
          perf_tool="$(find -L /usr/lib/linux-tools -type f -name perf | sort -V | tail -n 1)"
          test -x "$perf_tool"
          mkdir -p build/ci/ui-profile
          # Upload aggregated symbols and call graphs only, never the raw recording.
          trap 'sudo rm -f build/ci/ui-profile/perf.data build/ci/ui-profile/perf.data.old' EXIT
          sudo "$perf_tool" record --event cpu-clock:u --freq 199 --call-graph fp \
            --output build/ci/ui-profile/perf.data -- \
            build/ci/engine/kb_engine_tests scene-ui-profile > build/ci/ui-profile/workload.log 2>&1
          sudo "$perf_tool" report --stdio --no-children --sort symbol --percent-limit 0.5 \
            --input build/ci/ui-profile/perf.data > build/ci/ui-profile/symbols.txt
          sudo "$perf_tool" report --stdio --children --sort symbol --percent-limit 0.5 \
            --input build/ci/ui-profile/perf.data > build/ci/ui-profile/call-graph.txt

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            build/ci/TestResults.xml
            build/ci/Testing/Temporary/LastTest.log
            build/ci/ui-profile/workload.log
            build/ci/ui-profile/symbols.txt
            build/ci/ui-profile/call-graph.txt
          if-no-files-found: ignore

      # LIB-024: fail the build on a breaking change to the script API
      # surface versus the committed baseline. Runs only on the full
      # Windows build that generated the baseline; the reconstructed catalog
      # is platform-independent (renderer script APIs are compiled into
      # kb_engine unconditionally), but restricting to one job keeps the
      # gate unambiguous. An intentional API change updates the baseline via
      # `kb_cli api-check --baseline tests/api_baseline/script_api.json
      # --update-baseline` in the same PR.
      - name: API compatibility check
        if: matrix.api_compat_check == 'ON'
        shell: pwsh
        run: |
          & "build/ci/bin/${{ matrix.configuration }}/kb_cli.exe" api-check --baseline tests/api_baseline/script_api.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Script tests: the package contract, platform staging, third-party notices, SBOM and the
      # editor's translations (every editor text in all 32 catalogs).
      - name: Script tests
        if: matrix.name == 'Windows MSVC'
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  clang-tidy:
    name: clang-tidy gate
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
            submodules: recursive
            fetch-depth: 0

      # Ninja with the MSVC environment gives the compile database the gate reads.
      - name: Configure with a compile database
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Release -DKB_BUILD_EDITOR=ON -DKB_BUILD_GRAPH_SHADERC=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Pushes and pull requests check what they change; the weekly run checks every source.
      - name: clang-tidy
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $base = "${{ github.event.before }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
          }
          $scope = ""
          if ("${{ github.event_name }}" -ne "schedule" -and "${{ github.event_name }}" -ne "workflow_dispatch" -and
              $base -and $base -ne "0000000000000000000000000000000000000000" -and (git rev-parse --verify --quiet "$base^{commit}" 2>$null)) {
            $scope = "--changed-since $base"
          }
          cmd /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && python scripts/clang_tidy_gate.py --build-dir build/tidy --jobs 4 $scope"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  # libFuzzer harnesses for the readers of untrusted files (fuzz/). Replays every
  # committed seed and regression input, then gives each harness a minute of fresh
  # inputs; any crash, leak, hang or AddressSanitizer report fails the job.
  fuzz:
    name: Fuzz untrusted-input readers
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: "false"
        with:
            submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/fuzz -G "Visual Studio 18 2026" `
            -DKB_BUILD_FUZZERS=ON -DKB_ENABLE_SANITIZERS=ON -DKB_BUILD_EDITOR=OFF `
            -DKB_BUILD_GRAPH_SHADERC=OFF -DKB_STRICT_OWN_WARNINGS=ON
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build fuzzers
        shell: pwsh
        run: |
          cmake --build build/fuzz --config Release --parallel 4 --target kb_fuzzers
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Replay corpora
        shell: pwsh
        run: |
          ctest --test-dir build/fuzz -C Release -L fuzz --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Fuzz each reader for 60 seconds
        shell: pwsh
        run: |
          $failed = @()
          New-Item -ItemType Directory -Force build/fuzz/artifacts | Out-Null
          foreach ($corpus in Get-ChildItem fuzz/corpus -Directory) {
            $name = $corpus.Name
            $work = "build/fuzz/work/$name"
            New-Item -ItemType Directory -Force $work | Out-Null
            & "build/fuzz/fuzz/Release/kb_fuzz_$name.exe" $work $corpus.FullName `
              -max_total_time=60 -timeout=10 -rss_limit_mb=3072 -malloc_limit_mb=2048 `
              "-artifact_prefix=build/fuzz/artifacts/$name-"
            if ($LASTEXITCODE -ne 0) {
              $failed += $name
            }
          }
          if ($failed.Count -ne 0) {
            Write-Error "Fuzzing found failures in: $($failed -join ', ')"
            exit 1
          }

      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts
          if-no-files-found: ignore
