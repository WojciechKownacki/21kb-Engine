name: CI

on:
  push:
    branches: [Release, main, master, "1.0"]
  pull_request:
  workflow_dispatch:
    inputs:
      linux_package:
        description: Run the Linux package acceptance gate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'workflow_dispatch' || !inputs.linux_package
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "OFF"
            targets: "kb_21kb_particle_asset_tests;kb_21kb_particle_snapshot_tests;kb_21kb_particle_stage2_tests;kb_21kb_particle_cpu_backend_tests;kb_21kb_particle_editor_tests;kb_engine_tests;kb_audio_runtime_tests;kb_engine_library_tests;kb_library_benchmarks;kb_library_safety_tests;kb_ecs_api_tests;kb_ecs_scheduler_correctness_tests;kb_ecs_deterministic_replay_tests;kb_ecs_stress_tests;kb_ecs_snapshot_scale_tests;kb_renderer_tests;kb_21kb_particle_renderer_tests;kb_skeletal_animator_benchmarks;kb_terrain_editor_tests;kb_editor_particle_authoring_tests;kb_editor_particle_bake_host_tests;kb_editor_tests;kb_editor_material_graph_canvas_tests;kb_standalone_player;kb_editor;kb_cli;kb_cli_tests"
            api_compat_check: "ON"
            test_regex: ""
          - name: Windows MSVC ASan
            os: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            build_editor: "ON"
            build_renderer: "ON"
            sanitizer: "ON"
            targets: "kb_21kb_particle_snapshot_tests;kb_21kb_particle_cpu_backend_tests;kb_21kb_particle_editor_tests;kb_21kb_particle_renderer_tests;kb_renderer_tests"
            api_compat_check: "OFF"
            test_regex: "^(kb_21kb_particle_snapshot_tests|kb_21kb_particle_cpu_backend_tests|kb_21kb_particle_editor_tests|kb_21kb_particle_renderer_tests|kb_renderer_tests)$"
          - name: Linux GCC ASan UBSan
            os: ubuntu-24.04
            generator: "Unix Makefiles"
            build_editor: "OFF"
            build_renderer: "OFF"
            sanitizer: "ON"
            targets: "kb_21kb_particle_asset_tests;kb_21kb_particle_snapshot_tests;kb_21kb_particle_stage2_tests;kb_21kb_particle_cpu_backend_tests;kb_engine_tests;kb_audio_runtime_tests;kb_engine_library_tests;kb_library_benchmarks;kb_library_safety_tests;kb_ecs_api_tests;kb_ecs_scheduler_correctness_tests;kb_ecs_deterministic_replay_tests;kb_ecs_stress_tests;kb_ecs_snapshot_scale_tests;kb_cli_tests"
            api_compat_check: "OFF"
            test_regex: ""
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: advice.defaultBranchName
          GIT_CONFIG_VALUE_0: "false"
        with:
            submodules: recursive
            fetch-depth: 0

      - name: Validate changed patch whitespace
        shell: pwsh
        run: |
          $base = "${{ github.event.before }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $base = "${{ github.event.pull_request.base.sha }}"
          }
          if ($base -and $base -ne "0000000000000000000000000000000000000000" -and (git cat-file -e "$base^{commit}" 2>$null)) {
            git diff --check $base HEAD
          } else {
            git diff --check HEAD^ HEAD
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure
        shell: pwsh
        run: |
          $configureArgs = @(
            "-S", ".",
            "-B", "build/ci",
            "-G", "${{ matrix.generator }}",
            "-DKB_BUILD_EDITOR=${{ matrix.build_editor }}",
            "-DKB_BUILD_RENDERER=${{ matrix.build_renderer }}",
            "-DKB_ENABLE_SANITIZERS=${{ matrix.sanitizer }}",
            "-DKB_STRICT_OWN_WARNINGS=ON"
          )
          if (-not "${{ matrix.generator }}".StartsWith("Visual Studio")) {
            $configureArgs += "-DCMAKE_BUILD_TYPE=Debug"
          }
          cmake @configureArgs

      - name: Clean build with strict first-party warnings
        shell: pwsh
        run: |
          "${{ matrix.targets }}".Split(';') | ForEach-Object {
            cmake --build build/ci --config Debug --parallel 4 --target $_
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Test
        shell: pwsh
        run: |
          $testArgs = @("--test-dir", "build/ci", "-C", "Debug", "--output-on-failure")
          # Sanitizers deliberately distort timings; correctness and safety tests still run,
          # while the performance budget remains enforced by the unsanitized Windows job.
          if ("${{ matrix.sanitizer }}" -eq "ON") {
            $testArgs += @("--label-exclude", "performance")
          }
          if ("${{ matrix.test_regex }}") {
            $testArgs += @("-R", "${{ matrix.test_regex }}")
          }
          ctest @testArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # LIB-024: fail the build on a breaking change to the script API
      # surface versus the committed baseline. Runs only on the full
      # Windows build that generated the baseline; the reconstructed catalog
      # is platform-independent (renderer script APIs are compiled into
      # kb_engine unconditionally), but restricting to one job keeps the
      # gate unambiguous. An intentional API change updates the baseline via
      # `kb_cli api-check --baseline others/api_baseline/script_api.json
      # --update-baseline` in the same PR.
      - name: API compatibility check
        if: matrix.api_compat_check == 'ON'
        shell: pwsh
        run: |
          & "build/ci/bin/Debug/kb_cli.exe" api-check --baseline others/api_baseline/script_api.json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  linux-package:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_package
    name: Linux package acceptance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact sources
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify checkout identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Linux runtime and build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build python3 \
            libx11-dev libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers \
            xvfb xauth

      - name: Recreate verified package fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/camera-fixture"
          mkdir -p "$fixture/Assets/Scenes"
          printf '%s' 'MjFLQlBSSgAFAAAABAAAADIxa2IVAAAAQ2FtZXJhUnVudGltZVNlbGZUZXN0AAAAAAAAAAAGAAAAQXNzZXRzJAAAAC9HYW1lL1NjZW5lcy9DYW1lcmFSdW50aW1lLjIxa2JzY2VuZQAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAA' | base64 --decode > "$fixture/Project.21kbproject"
          printf '%s' 'MjFLQlBNVAABAAAAFQAAAENhbWVyYVJ1bnRpbWVTZWxmVGVzdAQAAAAyMWtiJAAAAC9HYW1lL1NjZW5lcy9DYW1lcmFSdW50aW1lLjIxa2JzY2VuZRMAAABQcm9qZWN0LjIxa2Jwcm9qZWN0gQAAAAAAAAAFHamhN6T380J44xQAAAAAAAAAAAAAAAA=' | base64 --decode > "$fixture/Project.meta"
          printf '%s' '' | base64 --decode > "$fixture/Assets/Scenes/CameraRuntime.21kbscene"
          printf '%s' 'MjFLQlNNVAABAAAAEwAAAHNjZW5lOkNhbWVyYVJ1bnRpbWUNAAAAQ2FtZXJhUnVudGltZQYAAABFZGl0b3IXAAAAQ2FtZXJhUnVudGltZS4yMWtic2NlbmVQAQAAAAAAAN09H7uDbRtb+7k7ZwIAAAACAAAAAAAAAA==' | base64 --decode > "$fixture/Assets/Scenes/CameraRuntime.meta"
          cd "$fixture"
          sha256sum --check <<'EOF'
          543e1b12d7985fe21649ed0dfd182bd0dc61014095c8ba27eff6349cf11f2ba5  Assets/Scenes/CameraRuntime.21kbscene
          66afb398c531eb13b380396a6d2b87c61e8de9095131699e6ba9e8e275bfcb23  Assets/Scenes/CameraRuntime.meta
          1da2bec03c298b6262fb2117c3bcaee4fb398024ebda34c07d40120deeceb9f1  Project.21kbproject
          63b20fa9489bd2685c4ada024543a49707ca23fbb5241bc094e143cd307d337c  Project.meta
          EOF

      - name: Configure package host tools
        shell: bash
        run: |
          cmake -S . -B build/package-linux-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKB_BUILD_EDITOR=OFF \
            -DKB_BUILD_RENDERER=ON \
            -DKB_BUILD_PACKAGED_GAME_HOST=OFF \
            -DKB_BUILD_PROVIDER_MODULES_AS_DLL=OFF \
            -DKB_BUILD_GRAPH_SHADERC=OFF \
            -DKB_GENERATE_RENDERER_SHADERS=OFF \
            -DBUILD_TESTING=OFF

      - name: Package and prove Linux first frame
        shell: bash
        run: |
          python3 scripts/package_game.py \
            --project "$RUNNER_TEMP/camera-fixture/Project.21kbproject" \
            --target Linux.x64 \
            --configuration Development \
            --output "$GITHUB_WORKSPACE/build/package-linux-final/PackagingAcceptance-Linux.x64" \
            --engine-root "$GITHUB_WORKSPACE" \
            --build-root "$GITHUB_WORKSPACE/build/package-linux-host" \
            --product-name "Packaging Acceptance" \
            --publisher "21kb" \
            --version 1.2.3 \
            --executable-name PackagingAcceptance

      - name: Verify sealed Linux package
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from package_contract import engine_source_fingerprint, verify_unit
          from package_game import _project_source_fingerprint

          unit = Path("build/package-linux-final/PackagingAcceptance-Linux.x64")
          receipt = verify_unit(unit)
          assert receipt["target"] == "Linux.x64"
          assert receipt["configuration"] == "Development"
          fixture = Path(os.environ["RUNNER_TEMP"]) / "camera-fixture" / "Project.21kbproject"
          assert receipt["inputs"] == {
              "engineSha256": engine_source_fingerprint(Path(".")),
              "projectSha256": _project_source_fingerprint(fixture),
          }
          evidence = receipt["runtimeFirstFrame"]
          assert evidence["probe"] == "linux-build-receipt"
          assert evidence["observed"] == "frames=1 rendered=1 shutdown=clean"
          assert evidence["payloadManifestSha256"] == receipt["manifestSha256"]
          assert (unit / "linux-build.receipt.json").is_file()
          assert "E:\\" not in (unit / "package.receipt.json").read_text(encoding="utf-8")
          print(receipt["manifestSha256"])
          PY

      - name: Archive sealed Linux package
        shell: bash
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf build/PackagingAcceptance-Linux.x64.tar.gz \
            -C build/package-linux-final PackagingAcceptance-Linux.x64
          tar -tzf build/PackagingAcceptance-Linux.x64.tar.gz >/dev/null

      - name: Upload sealed Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-acceptance-${{ github.sha }}
          path: build/PackagingAcceptance-Linux.x64.tar.gz
          if-no-files-found: error
          retention-days: 7
